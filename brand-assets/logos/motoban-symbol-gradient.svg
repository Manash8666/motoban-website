<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- MotoBan Standalone Brand Symbol / Glyph -->
  <defs>
    <linearGradient id="symBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9F31D" />
      <stop offset="100%" stop-color="#FF5E14" />
    </linearGradient>

    <linearGradient id="symHexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9F31D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.4" />
    </linearGradient>

    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Bolt Outer Shield -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" 
           fill="#151D2F" 
           stroke="url(#symHexGrad)" 
           stroke-width="3.5" 
           stroke-linejoin="round" />

  <!-- Inner Dark Obsidian Chamber -->
  <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" 
           fill="#0B0F19" />

  <!-- High-Velocity Lightning Bolt -->
  <path d="M54,18 L32,52 L47,52 L40,82 L68,46 L52,46 Z" 
        fill="url(#symBoltGrad)" 
        filter="url(#symGlow)" />

  <!-- Mechanical Alignment Rivets -->
  <circle cx="50" cy="10" r="2.5" fill="#C9F31D" />
  <circle cx="84" cy="30" r="2.5" fill="#C9F31D" />
  <circle cx="84" cy="70" r="2.5" fill="#2563EB" />
  <circle cx="50" cy="90" r="2.5" fill="#2563EB" />
  <circle cx="16" cy="70" r="2.5" fill="#2563EB" />
  <circle cx="16" cy="30" r="2.5" fill="#C9F31D" />
</svg>
