<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- MotoBan App Icon 512x512 (PWA / Mobile / Desktop Launcher) -->
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151D2F" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="appBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9F31D" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FF5E14" stop-opacity="0.4" />
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="appBoltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9F31D" />
      <stop offset="100%" stop-color="#FF5E14" />
    </linearGradient>

    <!-- Glowing Ambience -->
    <filter id="appGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Automotive Corner -->
  <rect x="16" y="16" width="480" height="480" rx="110" 
        fill="url(#appBgGrad)" 
        stroke="url(#appBorderGrad)" 
        stroke-width="8" />

  <!-- Subtle Radial Ambient Flare -->
  <circle cx="256" cy="220" r="160" fill="#C9F31D" opacity="0.12" filter="url(#appGlow)" />

  <!-- Outer Hexagonal Mechanical Shield -->
  <polygon points="256,76 396,157 396,319 256,400 116,319 116,157" 
           fill="#1A2338" 
           stroke="url(#appBoltGrad)" 
           stroke-width="12" 
           stroke-linejoin="round" />

  <!-- Inner Dark Chamber -->
  <polygon points="256,104 368,169 368,299 256,364 144,299 144,169" 
           fill="#0B0F19" />

  <!-- High-Voltage Speed Lightning -->
  <path d="M272,128 L176,260 L236,260 L208,380 L320,232 L260,232 Z" 
        fill="url(#appBoltGrad)" 
        filter="url(#appGlow)" />

  <!-- Corner Rivets -->
  <circle cx="256" cy="90" r="7" fill="#C9F31D" />
  <circle cx="382" cy="165" r="7" fill="#C9F31D" />
  <circle cx="382" cy="311" r="7" fill="#2563EB" />
  <circle cx="256" cy="386" r="7" fill="#2563EB" />
  <circle cx="130" cy="311" r="7" fill="#2563EB" />
  <circle cx="130" cy="165" r="7" fill="#C9F31D" />
</svg>
