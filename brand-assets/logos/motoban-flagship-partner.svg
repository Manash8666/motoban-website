<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="100%" height="100%" fill="none">
  <!-- Official Co-Branding Crest: MotoBan × MotoFit 2 Innovation Lab -->
  <defs>
    <linearGradient id="crestBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9F31D" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF5E14" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="338" height="70" rx="14" 
        fill="#0E1422" 
        stroke="url(#crestBorder)" 
        stroke-width="1.5" />

  <!-- Left: MotoBan Mini Brand -->
  <g transform="translate(16, 20)">
    <polygon points="12,2 20,7 20,17 12,22 4,17 4,7" fill="#151D2F" stroke="#C9F31D" stroke-width="1.2" />
    <path d="M13,4 L8,11 L11,11 L10,18 L16,10 L13,10 Z" fill="#C9F31D" />
    <text x="26" y="18" font-family="'Syne', sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">
      Moto<tspan fill="#C9F31D">Ban</tspan>
    </text>
  </g>

  <!-- Center: Cross / Multiplier Symbol -->
  <text x="148" y="42" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#64748B" text-anchor="middle">
    ×
  </text>

  <!-- Right: MotoFit 2 Crest -->
  <g transform="translate(178, 16)">
    <text x="0" y="21" font-family="'Syne', sans-serif" font-weight="800" font-size="16" fill="#FF5E14">
      MotoFit <tspan fill="#FFFFFF">2</tspan>
    </text>
    <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" letter-spacing="1" fill="#94A3B8">
      AHMEDABAD LAB
    </text>
  </g>

  <!-- Bottom Tagline -->
  <text x="170" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#64748B" text-anchor="middle">
    OFFICIAL PRODUCTION BENCHMARK GARAGE
  </text>
</svg>
